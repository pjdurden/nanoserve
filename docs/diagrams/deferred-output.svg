<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <pattern id="wasted" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#fef2f2"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#fca5a5" stroke-width="2"/>
    </pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="50" y="50" font-size="29" font-weight="700" fill="#1e1b4b">One journey home for k steps, and the rows it throws away</text>
  <text x="50" y="78" font-size="15.5" fill="#64748b">Day 47 moved the decode step's readback from `sample` to `collect` and did not remove it: a stop rule needs a Python int.</text>
  <text x="50" y="99" font-size="15.5" fill="#64748b">The only way to stop fewer times is to stop later. Keep the tokens on the device, launch the next step out of that same</text>
  <text x="50" y="120" font-size="15.5" fill="#64748b">tensor, bring k steps home together. The price is rows forwarded for requests that had already stopped.</text>

  <!-- ===================== LEFT TOP: four decode steps, twice ===================== -->
  <text x="50" y="158" font-size="14" font-weight="700" fill="#334155">four decode steps, window 0 and window 4</text>

  <rect x="50" y="172" width="510" height="192" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="66" y="196" font-size="10.5" font-weight="700" fill="#b91c1c">window 0: resolve every step (Day 47)</text>
  <rect x="66" y="204" width="70" height="24" rx="3" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3"/>
  <text x="101" y="220" font-size="9" fill="#166534" text-anchor="middle">fwd+sample</text>
  <rect x="136" y="204" width="30" height="24" rx="3" fill="#eef2ff" stroke="#4338ca" stroke-width="1.2"/>
  <line x1="136" y1="200" x2="136" y2="234" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="184" y="204" width="70" height="24" rx="3" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3"/>
  <text x="219" y="220" font-size="9" fill="#166534" text-anchor="middle">fwd+sample</text>
  <rect x="254" y="204" width="30" height="24" rx="3" fill="#eef2ff" stroke="#4338ca" stroke-width="1.2"/>
  <line x1="254" y1="200" x2="254" y2="234" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="302" y="204" width="70" height="24" rx="3" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3"/>
  <text x="337" y="220" font-size="9" fill="#166534" text-anchor="middle">fwd+sample</text>
  <rect x="372" y="204" width="30" height="24" rx="3" fill="#eef2ff" stroke="#4338ca" stroke-width="1.2"/>
  <line x1="372" y1="200" x2="372" y2="234" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="420" y="204" width="70" height="24" rx="3" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3"/>
  <text x="455" y="220" font-size="9" fill="#166534" text-anchor="middle">fwd+sample</text>
  <rect x="490" y="204" width="30" height="24" rx="3" fill="#eef2ff" stroke="#4338ca" stroke-width="1.2"/>
  <line x1="490" y1="200" x2="490" y2="234" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="66" y="248" font-size="10.5" font-weight="700" fill="#b91c1c">4 journeys home. Each `input_ids` rebuilt from output_token_ids[-1].</text>

  <text x="66" y="278" font-size="10.5" font-weight="700" fill="#166534">window 4: hold, and settle once</text>
  <rect x="66" y="286" width="70" height="24" rx="3" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3"/>
  <text x="101" y="302" font-size="9" fill="#166534" text-anchor="middle">fwd+sample</text>
  <rect x="184" y="286" width="70" height="24" rx="3" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3"/>
  <text x="219" y="302" font-size="9" fill="#166534" text-anchor="middle">fwd+sample</text>
  <rect x="302" y="286" width="70" height="24" rx="3" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3"/>
  <text x="337" y="302" font-size="9" fill="#166534" text-anchor="middle">fwd+sample</text>
  <rect x="420" y="286" width="70" height="24" rx="3" fill="#f0fdf4" stroke="#15803d" stroke-width="1.3"/>
  <text x="455" y="302" font-size="9" fill="#166534" text-anchor="middle">fwd+sample</text>
  <rect x="490" y="286" width="42" height="24" rx="3" fill="#eef2ff" stroke="#4338ca" stroke-width="1.4"/>
  <text x="511" y="302" font-size="8.5" fill="#3730a3" text-anchor="middle">settle</text>
  <line x1="490" y1="282" x2="490" y2="316" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M136 298 L182 298" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M254 298 L300 298" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M372 298 L418 298" stroke="#15803d" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="66" y="332" font-size="10.5" font-weight="700" fill="#166534">1 journey. The green arrows are the [rows] tensor unsqueezed to [rows, 1]:</text>
  <text x="66" y="346" font-size="10.5" font-weight="700" fill="#166534">the next step's input is a view of it, so it never comes home to be rebuilt.</text>
  <text x="66" y="360" font-size="10" fill="#64748b">torch.cat over the 4 held batches is a launch, not a stop. One .tolist() takes them all.</text>

  <!-- ===================== LEFT BOTTOM: the measurement ===================== -->
  <text x="50" y="398" font-size="14" font-weight="700" fill="#334155">measured: Llama-3.2-1B, cpu fp32, 4 slots, 12 tokens each</text>
  <line x1="50" y1="408" x2="560" y2="408" stroke="#cbd5e1" stroke-width="1.2"/>

  <text x="50" y="430" font-size="11.5" font-weight="700" fill="#64748b">window</text>
  <text x="205" y="430" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end">transfers/step</text>
  <text x="300" y="430" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end">collect</text>
  <text x="385" y="430" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end">settle</text>
  <text x="470" y="430" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end">overshoot</text>
  <text x="560" y="430" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end">waste</text>

  <text x="50" y="452" font-size="12" fill="#475569">0 (Day 47)</text>
  <text x="205" y="452" font-size="12" fill="#475569" text-anchor="end">1.000</text>
  <text x="300" y="452" font-size="12" fill="#475569" text-anchor="end">0.052 ms</text>
  <text x="385" y="452" font-size="12" fill="#475569" text-anchor="end">-</text>
  <text x="470" y="452" font-size="12" fill="#475569" text-anchor="end">0</text>
  <text x="560" y="452" font-size="12" font-weight="700" fill="#166534" text-anchor="end">0.00%</text>

  <text x="50" y="473" font-size="12" fill="#475569">1</text>
  <text x="205" y="473" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="end">1.000</text>
  <text x="300" y="473" font-size="12" fill="#475569" text-anchor="end">0.015 ms</text>
  <text x="385" y="473" font-size="12" fill="#475569" text-anchor="end">0.052 ms</text>
  <text x="470" y="473" font-size="12" fill="#475569" text-anchor="end">4</text>
  <text x="560" y="473" font-size="12" fill="#475569" text-anchor="end">7.69%</text>

  <text x="50" y="494" font-size="12" fill="#475569">2</text>
  <text x="205" y="494" font-size="12" fill="#475569" text-anchor="end">0.538</text>
  <text x="300" y="494" font-size="12" fill="#475569" text-anchor="end">0.015 ms</text>
  <text x="385" y="494" font-size="12" fill="#475569" text-anchor="end">0.039 ms</text>
  <text x="470" y="494" font-size="12" fill="#475569" text-anchor="end">4</text>
  <text x="560" y="494" font-size="12" fill="#475569" text-anchor="end">7.69%</text>

  <text x="50" y="515" font-size="12" fill="#475569">4</text>
  <text x="205" y="515" font-size="12" font-weight="700" fill="#c2410c" text-anchor="end">0.308</text>
  <text x="300" y="515" font-size="12" fill="#475569" text-anchor="end">0.013 ms</text>
  <text x="385" y="515" font-size="12" fill="#475569" text-anchor="end">0.026 ms</text>
  <text x="470" y="515" font-size="12" fill="#475569" text-anchor="end">4</text>
  <text x="560" y="515" font-size="12" fill="#475569" text-anchor="end">7.69%</text>

  <text x="50" y="536" font-size="12" fill="#475569">8</text>
  <text x="205" y="536" font-size="12" font-weight="700" fill="#c2410c" text-anchor="end">0.176</text>
  <text x="300" y="536" font-size="12" fill="#475569" text-anchor="end">0.015 ms</text>
  <text x="385" y="536" font-size="12" fill="#475569" text-anchor="end">0.018 ms</text>
  <text x="470" y="536" font-size="12" fill="#475569" text-anchor="end">20</text>
  <text x="560" y="536" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="end">29.41%</text>

  <rect x="50" y="552" width="510" height="90" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="66" y="574" font-size="11.5" font-weight="700" fill="#92400e">1/k is the floor, not the measurement.</text>
  <text x="66" y="592" font-size="11" fill="#78350f">0.308 at window 4, not 0.250: a held tensor whose rows are not this step's rows</text>
  <text x="66" y="608" font-size="11" fill="#78350f">cannot be this step's input, so every admission and every finish forces the readback</text>
  <text x="66" y="624" font-size="11" fill="#78350f">early. One row that never leaves the batch, 40 tokens: 0.268 at 4, 0.146 at 8.</text>
  <text x="66" y="638" font-size="10.5" fill="#a16207">The step is 1.0s on this box, so none of these microseconds are the story here.</text>

  <!-- ===================== RIGHT TOP: the trade ===================== -->
  <text x="600" y="158" font-size="14" font-weight="700" fill="#334155">why the window has a best value and not a large one</text>

  <rect x="600" y="172" width="550" height="192" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="616" y="194" font-size="11" font-weight="700" fill="#166534">saved: latency x (1 - 1/k)</text>
  <text x="616" y="210" font-size="10.5" fill="#475569">bounded by ONE transfer per step, however far you lag</text>
  <rect x="616" y="218" width="60" height="12" rx="2" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <rect x="616" y="234" width="150" height="12" rx="2" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <rect x="616" y="250" width="225" height="12" rx="2" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <rect x="616" y="266" width="262" height="12" rx="2" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
  <text x="890" y="228" font-size="10" fill="#64748b">k=1: 0.0us</text>
  <text x="890" y="244" font-size="10" fill="#64748b">k=2: 10.0us</text>
  <text x="890" y="260" font-size="10" fill="#64748b">k=4: 15.0us</text>
  <text x="890" y="276" font-size="10" fill="#64748b">k=8: 17.5us</text>

  <text x="616" y="300" font-size="11" font-weight="700" fill="#b91c1c">cost: (k+1)/2 rows per finished request</text>
  <text x="616" y="316" font-size="10.5" fill="#475569">linear in k, and it never stops growing</text>
  <rect x="616" y="324" width="30" height="12" fill="url(#wasted)" stroke="#fca5a5" stroke-width="1"/>
  <rect x="616" y="340" width="135" height="12" fill="url(#wasted)" stroke="#fca5a5" stroke-width="1"/>
  <text x="890" y="334" font-size="10" fill="#64748b">k=1: 1.0 rows</text>
  <text x="890" y="350" font-size="10" fill="#64748b">k=8: 4.5 rows</text>

  <!-- ===================== RIGHT MIDDLE: best window ===================== -->
  <text x="600" y="398" font-size="14" font-weight="700" fill="#334155">the arithmetic, at a 20us journey and a 0.5ms decode row</text>
  <line x1="600" y1="408" x2="1150" y2="408" stroke="#cbd5e1" stroke-width="1.2"/>

  <text x="600" y="430" font-size="11.5" font-weight="700" fill="#64748b">window</text>
  <text x="800" y="430" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end">net, 200 tokens</text>
  <text x="960" y="430" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end">net, 12 tokens</text>
  <text x="1150" y="430" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="end">waste, 12 tokens</text>

  <text x="600" y="452" font-size="12" fill="#475569">1</text>
  <text x="800" y="452" font-size="12" fill="#475569" text-anchor="end">-2.5 us</text>
  <text x="960" y="452" font-size="12" font-weight="700" fill="#c2410c" text-anchor="end">-41.7 us</text>
  <text x="1150" y="452" font-size="12" fill="#475569" text-anchor="end">7.7%</text>

  <text x="600" y="473" font-size="12" fill="#475569">2</text>
  <text x="800" y="473" font-size="12" fill="#475569" text-anchor="end">+6.3 us</text>
  <text x="960" y="473" font-size="12" fill="#475569" text-anchor="end">-52.5 us</text>
  <text x="1150" y="473" font-size="12" fill="#475569" text-anchor="end">11.1%</text>

  <text x="600" y="494" font-size="12" font-weight="700" fill="#166534">4</text>
  <text x="800" y="494" font-size="12" font-weight="700" fill="#166534" text-anchor="end">+8.8 us</text>
  <text x="960" y="494" font-size="12" fill="#475569" text-anchor="end">-89.2 us</text>
  <text x="1150" y="494" font-size="12" fill="#475569" text-anchor="end">17.2%</text>

  <text x="600" y="515" font-size="12" fill="#475569">8</text>
  <text x="800" y="515" font-size="12" fill="#475569" text-anchor="end">+6.3 us</text>
  <text x="960" y="515" font-size="12" fill="#475569" text-anchor="end">-170.0 us</text>
  <text x="1150" y="515" font-size="12" fill="#475569" text-anchor="end">27.3%</text>

  <text x="600" y="536" font-size="12" fill="#475569">16</text>
  <text x="800" y="536" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="end">-2.5 us</text>
  <text x="960" y="536" font-size="12" fill="#475569" text-anchor="end">-335.4 us</text>
  <text x="1150" y="536" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="end">41.5%</text>

  <text x="600" y="560" font-size="11" font-weight="700" fill="#1e1b4b">Best window 4 at 200 tokens, and 1 at 12: how long a request runs decides how</text>
  <text x="600" y="576" font-size="11" font-weight="700" fill="#1e1b4b">far you may lag. A chat server with short answers should not defer at all.</text>

  <!-- ===================== RIGHT BOTTOM: the hazard ===================== -->
  <rect x="600" y="588" width="550" height="54" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.3"/>
  <text x="616" y="608" font-size="11.5" font-weight="700" fill="#991b1b">The bug that is not about tokens: num_tokens lags the cache row.</text>
  <text x="616" y="624" font-size="11" fill="#7f1d1d">A held token is already written into the row. Without Scheduler(lookahead=k) the row</text>
  <text x="616" y="637" font-size="11" fill="#7f1d1d">crosses a block boundary the request has not paid for, and BlockTable.append does not raise.</text>
</svg>
