<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4338ca"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="50" y="46" font-size="24" font-weight="700" fill="#1e1b4b">The split server grades its own two passes before it serves.</text>
  <text x="50" y="72" font-size="14.5" fill="#64748b">The jitted passes only get checked if someone runs the gated tests on a card. A server knows its device before it</text>
  <text x="50" y="92" font-size="14.5" fill="#64748b">serves, so build_app now runs split_partials and split_reduce on a tiny case, grades each against plain torch,</text>
  <text x="50" y="112" font-size="14.5" fill="#64748b">and refuses to boot if either pass is wrong on this backend. About 20 ms, before the arena is reserved.</text>

  <!-- ===================== LEFT TOP: the boot path ===================== -->
  <text x="50" y="150" font-size="13.5" font-weight="700" fill="#334155">Where the probe sits on the boot path</text>
  <rect x="50" y="162" width="530" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="9.5" font-family="ui-monospace, monospace">
    <rect x="70" y="180" width="140" height="30" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="82" y="199" font-weight="700" fill="#334155">build_engine</text>
    <rect x="240" y="180" width="140" height="30" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="252" y="199" font-weight="700" fill="#334155">plan_capture</text>

    <rect x="70" y="236" width="220" height="52" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="80" y="254" font-weight="700" fill="#166534">probe_split_read  (Day 71)</text>
    <text x="80" y="270" fill="#166534">read.block, cfg heads, pool dtype</text>
    <text x="80" y="282" fill="#166534">on the engine's own device</text>

    <rect x="320" y="236" width="120" height="52" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="330" y="258" font-weight="700" fill="#334155">arm_split_read</text>
    <text x="330" y="274" fill="#475569">arena reserved</text>

    <rect x="460" y="236" width="100" height="52" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="470" y="258" font-weight="700" fill="#334155">warm_engine</text>
    <text x="470" y="274" fill="#475569">then serve</text>

    <rect x="70" y="310" width="220" height="28" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="80" y="328" fill="#b91c1c" font-weight="700">BootUnsound: names the pass</text>
  </g>
  <path d="M 210 195 L 238 195" stroke="#4338ca" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 310 211 L 180 234" stroke="#4338ca" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 290 262 L 318 262" stroke="#4338ca" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 440 262 L 458 262" stroke="#4338ca" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 180 289 L 180 308" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="70" y="360" font-size="10.5" font-weight="700" fill="#b45309">A refused server never held the arena. The probe's own workspace is a few KB.</text>

  <!-- ===================== RIGHT TOP: the case ===================== -->
  <text x="620" y="150" font-size="13.5" font-weight="700" fill="#334155">The probe's case is chosen, not sampled (chunk = one tile)</text>
  <rect x="620" y="162" width="530" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="9.5" font-family="ui-monospace, monospace">
    <text x="642" y="186" fill="#475569">row 0: 2*block + 1 keys, three live chunks</text>
    <g stroke="#ffffff" stroke-width="1">
      <rect x="642" y="196" width="144" height="22" fill="#c7d2fe"/>
      <rect x="786" y="196" width="144" height="22" fill="#a5b4fc"/>
      <rect x="930" y="196" width="18" height="22" fill="#818cf8"/>
      <rect x="948" y="196" width="126" height="22" fill="#e2e8f0"/>
    </g>
    <text x="690" y="211" fill="#1e1b4b">chunk 0</text>
    <text x="834" y="211" fill="#1e1b4b">chunk 1</text>
    <text x="956" y="211" fill="#64748b">padding</text>
    <text x="918" y="234" fill="#4338ca" font-weight="700">1 key past the boundary</text>

    <text x="642" y="262" fill="#475569">row 1: one key, one live chunk (the control)</text>
    <g stroke="#ffffff" stroke-width="1">
      <rect x="642" y="272" width="18" height="22" fill="#c7d2fe"/>
      <rect x="660" y="272" width="414" height="22" fill="#e2e8f0"/>
    </g>
    <text x="680" y="287" fill="#64748b">chunks 1 and 2 own nothing: -inf, 0, 0</text>
  </g>
  <text x="642" y="322" font-size="10.5" fill="#166534">Row 0 breaks both planted mutants: the overrun and keep-the-winner.</text>
  <text x="642" y="340" font-size="10.5" fill="#b91c1c">Row 1 passes both. A probe of short rows only would pass them too.</text>
  <text x="642" y="358" font-size="10.5" fill="#64748b">Two KV heads, each read by n_rep query heads, like the served model.</text>

  <!-- ===================== LEFT BOTTOM: the numbers ===================== -->
  <text x="50" y="412" font-size="13.5" font-weight="700" fill="#334155">Three grades, max abs error, bound 1e-3 (tlsim, head_dim 64, n_rep 4)</text>
  <rect x="50" y="424" width="530" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="9.5" font-family="ui-monospace, monospace">
    <text x="70" y="448" font-weight="700" fill="#334155">what ran</text>
    <text x="250" y="448" font-weight="700" fill="#334155">pass one</text>
    <text x="340" y="448" font-weight="700" fill="#334155">pass two</text>
    <text x="430" y="448" font-weight="700" fill="#334155">read</text>
    <line x1="70" y1="456" x2="558" y2="456" stroke="#e2e8f0" stroke-width="1"/>

    <text x="70" y="476" fill="#475569">honest, block 16, fp32</text>
    <text x="250" y="476" fill="#166534">1.9e-06</text><text x="340" y="476" fill="#166534">0</text><text x="430" y="476" fill="#166534">2.4e-07</text>
    <text x="70" y="496" fill="#475569">honest, block 16, bf16</text>
    <text x="250" y="496" fill="#166534">9.5e-07</text><text x="340" y="496" fill="#166534">0</text><text x="430" y="496" fill="#166534">2.4e-07</text>
    <text x="70" y="516" fill="#475569">honest, block 64, fp16</text>
    <text x="250" y="516" fill="#166534">2.4e-06</text><text x="340" y="516" fill="#166534">0</text><text x="430" y="516" fill="#166534">1.3e-07</text>
    <text x="70" y="536" fill="#475569">overrun (Day 70), block 16</text>
    <text x="250" y="536" fill="#b91c1c" font-weight="700">6.22</text><text x="340" y="536" fill="#94a3b8">not reached</text>
    <text x="70" y="556" fill="#475569">keep winner (Day 68), 16</text>
    <text x="250" y="556" fill="#166534">ok</text><text x="340" y="556" fill="#b91c1c" font-weight="700">2.92</text>
  </g>
  <line x1="70" y1="570" x2="558" y2="570" stroke="#e2e8f0" stroke-width="1"/>
  <text x="70" y="590" font-size="10.5" fill="#64748b">Pass two is graded on the reference's partials, so a wrong pass one</text>
  <text x="70" y="608" font-size="10.5" fill="#64748b">cannot hide a wrong pass two, or the other way round.</text>
  <text x="70" y="626" font-size="10.5" font-weight="700" fill="#b45309">Six orders of magnitude between honest and wrong; the bound is in the middle.</text>

  <!-- ===================== RIGHT BOTTOM: who grades what ===================== -->
  <text x="620" y="412" font-size="13.5" font-weight="700" fill="#334155">Who grades the jitted passes now</text>
  <rect x="620" y="424" width="530" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="9.5" font-family="ui-monospace, monospace">
    <text x="642" y="448" font-weight="700" fill="#334155">situation</text>
    <text x="860" y="448" font-weight="700" fill="#334155">graded by</text>
    <line x1="642" y1="458" x2="1128" y2="458" stroke="#e2e8f0" stroke-width="1"/>

    <text x="642" y="478" fill="#475569">tlsim passes, any box</text>
    <text x="860" y="478" fill="#166534" font-weight="700">pytest, and the probe at boot</text>

    <text x="642" y="500" fill="#475569">Triton passes, Day 70</text>
    <text x="860" y="500" fill="#b91c1c" font-weight="700">gated tests, if someone runs them</text>

    <text x="642" y="522" fill="#475569">Triton passes, Day 71</text>
    <text x="860" y="522" fill="#166534" font-weight="700">every --split-read boot on a card</text>
  </g>
  <line x1="642" y1="538" x2="1128" y2="538" stroke="#e2e8f0" stroke-width="1"/>
  <text x="642" y="558" font-size="10.5" fill="#64748b">The probe runs with the read's own tile, the model's head_dim and GQA</text>
  <text x="642" y="573" font-size="10.5" fill="#64748b">factor, and the pool's dtype: the constexprs the served kernel compiles.</text>
  <text x="642" y="588" font-size="10.5" fill="#64748b">/health carries the result under split_probe, with the backend named.</text>
  <text x="642" y="619" font-size="10.5" font-weight="700" fill="#b91c1c">2269 green. 33 gated skips, waiting on a card.</text>
</svg>
