<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4338ca"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="50" y="46" font-size="24" font-weight="700" fill="#1e1b4b">The split server times its own read, and says if it paid.</text>
  <text x="50" y="72" font-size="14.5" fill="#64748b">Day 71's probe says the two passes are right on this device. It says nothing about whether they are worth it.</text>
  <text x="50" y="92" font-size="14.5" fill="#64748b">So build_app now times the split read against the unsplit one on a case built for the prediction, and puts</text>
  <text x="50" y="112" font-size="14.5" fill="#64748b">predicted and measured side by side in /health. Reported, never enforced: four rows is not the serving batch.</text>

  <!-- ===================== LEFT TOP: the boot path ===================== -->
  <text x="50" y="150" font-size="13.5" font-weight="700" fill="#334155">Where the timing sits on the boot path</text>
  <rect x="50" y="162" width="530" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="9.5" font-family="ui-monospace, monospace">
    <rect x="70" y="180" width="140" height="30" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="82" y="199" font-weight="700" fill="#334155">plan_capture</text>
    <rect x="240" y="180" width="160" height="30" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="252" y="199" font-weight="700" fill="#334155">probe_split_read (71)</text>

    <rect x="70" y="236" width="230" height="52" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="80" y="254" font-weight="700" fill="#166534">measure_split_read  (Day 72)</text>
    <text x="80" y="270" fill="#166534">same tile, heads, dtype as probe</text>
    <text x="80" y="282" fill="#166534">warm once, median of 5, synced</text>

    <rect x="320" y="236" width="120" height="52" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="330" y="258" font-weight="700" fill="#334155">arm_split_read</text>
    <text x="330" y="274" fill="#475569">arena reserved</text>

    <rect x="460" y="236" width="100" height="52" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="470" y="258" font-weight="700" fill="#334155">warm_engine</text>
    <text x="470" y="274" fill="#475569">then serve</text>

    <rect x="70" y="310" width="230" height="28" rx="5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="80" y="328" fill="#b91c1c" font-weight="700">BootUnsound: timed reads disagree</text>
  </g>
  <path d="M 210 195 L 238 195" stroke="#4338ca" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 320 211 L 190 234" stroke="#4338ca" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 300 262 L 318 262" stroke="#4338ca" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 440 262 L 458 262" stroke="#4338ca" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 185 289 L 185 308" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="70" y="360" font-size="10.5" font-weight="700" fill="#b45309">A slow split is a number in /health. Only a wrong one refuses the boot.</text>

  <!-- ===================== RIGHT TOP: the case ===================== -->
  <text x="620" y="150" font-size="13.5" font-weight="700" fill="#334155">The timed case: one long row, three one-key rows</text>
  <rect x="620" y="162" width="530" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="9.5" font-family="ui-monospace, monospace">
    <text x="642" y="186" fill="#475569">unsplit: one program per (row, head), tail = 4 tiles</text>
    <g stroke="#ffffff" stroke-width="1">
      <rect x="642" y="196" width="400" height="22" fill="#fca5a5"/>
    </g>
    <text x="760" y="211" fill="#7f1d1d" font-weight="700">row 0: 4 tiles, one program</text>
    <g stroke="#ffffff" stroke-width="1">
      <rect x="642" y="222" width="20" height="10" fill="#c7d2fe"/>
      <rect x="642" y="234" width="20" height="10" fill="#c7d2fe"/>
      <rect x="642" y="246" width="20" height="10" fill="#c7d2fe"/>
    </g>
    <text x="672" y="243" fill="#64748b">rows 1 to 3: one key each, done, waiting</text>

    <text x="642" y="280" fill="#475569">split: chunks one tile wide, tail = 1 tile</text>
    <g stroke="#ffffff" stroke-width="1">
      <rect x="642" y="290" width="100" height="22" fill="#86efac"/>
      <rect x="742" y="290" width="100" height="22" fill="#86efac"/>
      <rect x="842" y="290" width="100" height="22" fill="#86efac"/>
      <rect x="942" y="290" width="100" height="22" fill="#86efac"/>
    </g>
    <text x="668" y="305" fill="#14532d">chunk 0</text>
    <text x="768" y="305" fill="#14532d">chunk 1</text>
    <text x="868" y="305" fill="#14532d">chunk 2</text>
    <text x="968" y="305" fill="#14532d">chunk 3</text>
  </g>
  <text x="642" y="336" font-size="10.5" font-weight="700" fill="#4338ca">predicted = wave_speedup = 4 / 1 = long_tiles, exactly.</text>
  <text x="642" y="354" font-size="10.5" fill="#64748b">The two outputs must agree to 1e-3 before either time is believed.</text>

  <!-- ===================== LEFT BOTTOM: the numbers ===================== -->
  <text x="50" y="412" font-size="13.5" font-weight="700" fill="#334155">On the host (tlsim, head_dim 64, n_rep 4, median of 5)</text>
  <rect x="50" y="424" width="530" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="9.5" font-family="ui-monospace, monospace">
    <text x="70" y="448" font-weight="700" fill="#334155">case</text>
    <text x="250" y="448" font-weight="700" fill="#334155">predicted</text>
    <text x="330" y="448" font-weight="700" fill="#334155">unsplit</text>
    <text x="410" y="448" font-weight="700" fill="#334155">split</text>
    <text x="490" y="448" font-weight="700" fill="#334155">measured</text>
    <line x1="70" y1="456" x2="558" y2="456" stroke="#e2e8f0" stroke-width="1"/>

    <text x="70" y="476" fill="#475569">block 4, 4 tiles, fp32</text>
    <text x="250" y="476" fill="#4338ca">4.00x</text><text x="330" y="476" fill="#475569">11.13 ms</text><text x="410" y="476" fill="#475569">21.77 ms</text><text x="490" y="476" fill="#b91c1c" font-weight="700">0.51x</text>
    <text x="70" y="496" fill="#475569">block 16, 4 tiles, fp32</text>
    <text x="250" y="496" fill="#4338ca">4.00x</text><text x="330" y="496" fill="#475569">11.64 ms</text><text x="410" y="496" fill="#475569">22.24 ms</text><text x="490" y="496" fill="#b91c1c" font-weight="700">0.52x</text>
    <text x="70" y="516" fill="#475569">block 16, 8 tiles, fp32</text>
    <text x="250" y="516" fill="#4338ca">8.00x</text><text x="330" y="516" fill="#475569">17.02 ms</text><text x="410" y="516" fill="#475569">37.17 ms</text><text x="490" y="516" fill="#b91c1c" font-weight="700">0.46x</text>
    <text x="70" y="536" fill="#475569">block 16, 4 tiles, bf16</text>
    <text x="250" y="536" fill="#4338ca">4.00x</text><text x="330" y="536" fill="#475569">12.10 ms</text><text x="410" y="536" fill="#475569">22.72 ms</text><text x="490" y="536" fill="#b91c1c" font-weight="700">0.53x</text>
  </g>
  <line x1="70" y1="556" x2="558" y2="556" stroke="#e2e8f0" stroke-width="1"/>
  <text x="70" y="578" font-size="10.5" fill="#64748b">Doubling the tiles doubles the prediction and makes the host ratio worse:</text>
  <text x="70" y="596" font-size="10.5" fill="#64748b">more chunks means more empty programs on the short rows, each paid in full.</text>
  <text x="70" y="622" font-size="10.5" font-weight="700" fill="#b45309">Neither number is wrong. They answer different questions.</text>

  <!-- ===================== RIGHT BOTTOM: work vs wave ===================== -->
  <text x="620" y="412" font-size="13.5" font-weight="700" fill="#334155">What each machine collects</text>
  <rect x="620" y="424" width="530" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="9.5" font-family="ui-monospace, monospace">
    <text x="642" y="448" font-weight="700" fill="#334155">machine</text>
    <text x="860" y="448" font-weight="700" fill="#334155">wall time is</text>
    <line x1="642" y1="458" x2="1128" y2="458" stroke="#e2e8f0" stroke-width="1"/>

    <text x="642" y="478" fill="#475569">tlsim, one program at a time</text>
    <text x="860" y="478" fill="#b91c1c" font-weight="700">the work: sum over programs</text>

    <text x="642" y="500" fill="#475569">card, whole grid resident</text>
    <text x="860" y="500" fill="#166534" font-weight="700">the wave: max over programs</text>

    <text x="642" y="522" fill="#475569">split, per head</text>
    <text x="860" y="522" fill="#475569">16 programs (was 4), + a reduce</text>
  </g>
  <line x1="642" y1="538" x2="1128" y2="538" stroke="#e2e8f0" stroke-width="1"/>
  <text x="642" y="558" font-size="10.5" fill="#64748b">The split keeps the work and cuts the wave. A serial box only sees the</text>
  <text x="642" y="573" font-size="10.5" fill="#64748b">work, so 0.5x here is the correct answer. /health carries split_timing</text>
  <text x="642" y="588" font-size="10.5" fill="#64748b">beside split_probe; a timing with no probe, or on another backend, is refused.</text>
  <text x="642" y="619" font-size="10.5" font-weight="700" fill="#b91c1c">2288 green. 34 gated skips, waiting on a card.</text>
</svg>
