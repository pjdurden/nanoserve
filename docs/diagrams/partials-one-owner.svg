<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4338ca"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="50" y="46" font-size="24" font-weight="700" fill="#1e1b4b">The partials had two owners, and the probe asked the one with the wrong rows.</text>
  <text x="50" y="72" font-size="14.5" fill="#64748b">A split server printed its partials twice: folded into the capture's workspace, and again on the arena's own line.</text>
  <text x="50" y="92" font-size="14.5" fill="#64748b">Picking one owner was not taste. The graph pool never holds a partial, and the budget probe had priced them at the</text>
  <text x="50" y="112" font-size="14.5" fill="#64748b">recorded rows while the cache allocates them at the served rows. With --warm-rows 1, that is 0.33 MB asked, 68.22 MB held.</text>

  <!-- ===================== LEFT TOP: who holds what ===================== -->
  <text x="50" y="150" font-size="13.5" font-weight="700" fill="#334155">Where a split launch's two halves actually live</text>
  <rect x="50" y="162" width="530" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="9.5" font-family="ui-monospace, monospace">
    <rect x="70" y="180" width="140" height="80" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="80" y="200" font-weight="700" fill="#4338ca">split launch</text>
    <text x="80" y="222" fill="#475569">score tiles</text>
    <text x="80" y="242" fill="#475569">partials m, l, acc</text>

    <rect x="330" y="176" width="230" height="44" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="340" y="194" font-weight="700" fill="#4338ca">graph pool: pool_bytes</text>
    <text x="340" y="210" fill="#94a3b8">tiles only, max over recorded shapes</text>

    <rect x="330" y="232" width="230" height="44" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="340" y="250" font-weight="700" fill="#166534">arena: partial_bytes</text>
    <text x="340" y="266" fill="#166534">allocated once, at arena_rows</text>
  </g>
  <path d="M 211 218 L 327 198" stroke="#4338ca" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 211 238 L 327 254" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="70" y="300" font-size="10.5" fill="#64748b">Day 64 priced both halves into the pool: an allocation made while a graph records is</text>
  <text x="70" y="315" font-size="10.5" fill="#64748b">served from its pool. True for one day. The same day moved the partials into an arena,</text>
  <text x="70" y="330" font-size="10.5" fill="#64748b">and PagedRead refuses a split launch without one, so no recording ever allocates a partial.</text>
  <text x="70" y="354" font-size="10.5" font-weight="700" fill="#b45309">The pool is the tiles. The arena is the partials. Each byte, one line.</text>

  <!-- ===================== RIGHT TOP: the rows ===================== -->
  <text x="620" y="150" font-size="13.5" font-weight="700" fill="#334155">--warm-rows trims the list, not the arena</text>
  <rect x="620" y="162" width="530" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="9.5" font-family="ui-monospace, monospace">
    <text x="642" y="186" font-weight="700" fill="#334155">number</text>
    <text x="850" y="186" font-weight="700" fill="#334155">rows it is sized by</text>

    <text x="642" y="210" fill="#475569">recorded list</text>
    <text x="850" y="210" fill="#475569">max_rows (the --warm-rows trim)</text>

    <text x="642" y="232" fill="#475569">graph pool</text>
    <text x="850" y="232" fill="#475569">max_rows</text>

    <text x="642" y="254" fill="#166534" font-weight="700">partials arena</text>
    <text x="850" y="254" fill="#166534" font-weight="700">arena_rows = slot count</text>

    <text x="642" y="276" fill="#b91c1c">Day 66 probe</text>
    <text x="850" y="276" fill="#b91c1c">max_rows for both halves</text>
  </g>

  <line x1="642" y1="292" x2="1128" y2="292" stroke="#e2e8f0" stroke-width="1"/>
  <text x="642" y="312" font-size="10.5" fill="#64748b">A shape the list skipped still runs, eagerly, against the same arena, so the cache sizes</text>
  <text x="642" y="327" font-size="10.5" fill="#64748b">it for every slot. The probe priced it for the recorded rows only. CapturePlan now carries</text>
  <text x="642" y="342" font-size="10.5" fill="#64748b">arena_rows, and the probe is asked about pool_bytes + partial_bytes = reserved_bytes.</text>
  <text x="642" y="362" font-size="10.5" font-weight="700" fill="#b91c1c">Lowering --warm-rows never shrank the partials. The refusal now says so.</text>

  <!-- ===================== LEFT BOTTOM: ownerbench ===================== -->
  <text x="50" y="412" font-size="13.5" font-weight="700" fill="#334155">ownerbench.py: 16-way split, 256 slots, 8192 tokens, 32 x 128</text>
  <rect x="50" y="424" width="530" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="9.5" font-family="ui-monospace, monospace">
    <text x="66" y="448" font-weight="700" fill="#334155">warm</text>
    <text x="110" y="448" font-weight="700" fill="#334155">day</text>
    <text x="160" y="448" font-weight="700" fill="#334155">capture</text>
    <text x="240" y="448" font-weight="700" fill="#334155">arena</text>
    <text x="316" y="448" font-weight="700" fill="#334155">summed</text>
    <text x="396" y="448" font-weight="700" fill="#334155">probe</text>
    <text x="476" y="448" font-weight="700" fill="#334155">held</text>

    <text x="66" y="472" fill="#475569">256</text>
    <text x="110" y="472" fill="#475569">66</text>
    <text x="160" y="472" fill="#b91c1c">84.93</text>
    <text x="240" y="472" fill="#475569">68.16</text>
    <text x="316" y="472" fill="#b91c1c">153.09</text>
    <text x="396" y="472" fill="#475569">84.93</text>
    <text x="476" y="472" fill="#475569">84.93</text>

    <text x="66" y="492" fill="#475569">256</text>
    <text x="110" y="492" fill="#166534" font-weight="700">67</text>
    <text x="160" y="492" fill="#166534">16.78</text>
    <text x="240" y="492" fill="#475569">68.16</text>
    <text x="316" y="492" fill="#166534">84.93</text>
    <text x="396" y="492" fill="#166534">84.93</text>
    <text x="476" y="492" fill="#475569">84.93</text>

    <text x="66" y="522" fill="#475569">1</text>
    <text x="110" y="522" fill="#475569">66</text>
    <text x="160" y="522" fill="#475569">0.33</text>
    <text x="240" y="522" fill="#475569">68.16</text>
    <text x="316" y="522" fill="#475569">68.49</text>
    <text x="396" y="522" fill="#b91c1c">0.33</text>
    <text x="476" y="522" fill="#475569">68.22</text>

    <text x="66" y="542" fill="#475569">1</text>
    <text x="110" y="542" fill="#166534" font-weight="700">67</text>
    <text x="160" y="542" fill="#166534">0.07</text>
    <text x="240" y="542" fill="#475569">68.16</text>
    <text x="316" y="542" fill="#166534">68.22</text>
    <text x="396" y="542" fill="#166534">68.22</text>
    <text x="476" y="542" fill="#475569">68.22</text>
  </g>

  <line x1="72" y1="562" x2="558" y2="562" stroke="#e2e8f0" stroke-width="1"/>
  <text x="72" y="580" font-size="10.5" fill="#64748b">MB, arithmetic only. Day 66: three different numbers for summed, probe and held.</text>
  <text x="72" y="595" font-size="10.5" fill="#64748b">Day 67: one. Full list: the log over-reported by a whole arena. One row: the probe</text>
  <text x="72" y="610" font-size="10.5" fill="#64748b">was asked about 0.33 MB of a 68.22 MB reservation.</text>
  <text x="72" y="628" font-size="10.5" font-weight="700" fill="#b45309">Opposite errors, one cause: the partials had no owner and no rows of their own.</text>

  <!-- ===================== RIGHT BOTTOM: what it prints ===================== -->
  <text x="620" y="412" font-size="13.5" font-weight="700" fill="#334155">The boot log, each byte once, and a gate that holds it</text>
  <rect x="620" y="424" width="530" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="8.8" font-family="ui-monospace, monospace">
    <text x="636" y="448" fill="#94a3b8">KV pool: 256 blocks x 4 tokens = 1024 tokens, 4 slots</text>
    <text x="636" y="468" fill="#4338ca">CUDA graphs: 3 of 3 shapes, ..., 2-way split, 0.0 MiB of workspace,</text>
    <text x="636" y="482" fill="#4338ca">  partials on the split workspace line</text>
    <text x="636" y="502" font-weight="700" fill="#166534">split workspace: 4 rows x 8 heads x 2 splits of 512 keys,</text>
    <text x="636" y="516" font-weight="700" fill="#166534">  over a 1024-wide mapping, 0.00 MiB, allocated once</text>
  </g>

  <line x1="642" y1="536" x2="1128" y2="536" stroke="#e2e8f0" stroke-width="1"/>
  <text x="642" y="556" font-size="10.5" fill="#64748b">check_arena_matches_capture gains one equality: capture.partial_bytes must be exactly</text>
  <text x="642" y="571" font-size="10.5" fill="#64748b">workspace.bytes. Day 66 bounded the rows (what is recorded); this pins the bytes (what</text>
  <text x="642" y="586" font-size="10.5" fill="#64748b">was priced). In /health, the two keys now sum to reserved_bytes.</text>
  <text x="642" y="610" font-size="10.5" font-weight="700" fill="#b91c1c">2195 green. Still no second measured.</text>
</svg>
