<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4338ca"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="50" y="46" font-size="24" font-weight="700" fill="#1e1b4b">The third arm passed, on a server that never split.</text>
  <text x="50" y="72" font-size="14.5" fill="#64748b">Adding a --split-read server to Day 60's socket comparison took five lines, and every gate went green. At the</text>
  <text x="50" y="92" font-size="14.5" fill="#64748b">toy width the planner picks one chunk. At a width that splits, the short prompts never leave the first chunk.</text>
  <text x="50" y="112" font-size="14.5" fill="#64748b">Either way the reduce merges one live partial per row, and a combine with the rescale deleted still passes.</text>

  <!-- ===================== LEFT TOP: three configurations ===================== -->
  <text x="50" y="150" font-size="13.5" font-weight="700" fill="#334155">Where each row's last read lands</text>
  <rect x="50" y="162" width="530" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="9.5" font-family="ui-monospace, monospace">
    <text x="70" y="186" font-weight="700" fill="#b91c1c">width 32, 1 chunk, PLANS: reads 20 keys</text>
    <rect x="70" y="194" width="480" height="18" rx="3" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <rect x="70" y="194" width="300" height="18" rx="3" fill="#fecaca" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="378" y="207" fill="#94a3b8">chunk 0 is the whole width</text>

    <text x="70" y="240" font-weight="700" fill="#b91c1c">width 1024, 2 x 512, PLANS: reads 20 keys</text>
    <rect x="70" y="248" width="240" height="18" rx="3" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <rect x="310" y="248" width="240" height="18" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="70" y="248" width="10" height="18" rx="2" fill="#fecaca" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="320" y="261" fill="#94a3b8">chunk 1: -inf, 0, 0</text>

    <text x="70" y="294" font-weight="700" fill="#166534">width 1024, 2 x 512, SPLIT_PLANS: reads 521 keys</text>
    <rect x="70" y="302" width="240" height="18" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <rect x="310" y="302" width="240" height="18" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="310" y="302" width="4" height="18" fill="#16a34a"/>
    <text x="320" y="315" fill="#166534">9 keys into chunk 1</text>
  </g>
  <text x="70" y="346" font-size="10.5" fill="#64748b">An empty chunk stores -inf, 0, 0 and drops out of the reduce with no branch (Day 63).</text>
  <text x="70" y="362" font-size="10.5" font-weight="700" fill="#b45309">Only the third bar puts two live partials in front of the combine.</text>

  <!-- ===================== RIGHT TOP: the mutant ===================== -->
  <text x="620" y="150" font-size="13.5" font-weight="700" fill="#334155">A broken combine, run through all three</text>
  <rect x="620" y="162" width="530" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="9.5" font-family="ui-monospace, monospace">
    <text x="642" y="186" fill="#475569">alpha = exp(m_s - joint)</text>
    <text x="820" y="186" fill="#94a3b8">the rescale</text>
    <text x="642" y="206" fill="#b91c1c" font-weight="700">alpha = (m_s == joint)</text>
    <text x="820" y="206" fill="#b91c1c">mutant: keep the winning chunk</text>

    <line x1="642" y1="220" x2="1128" y2="220" stroke="#e2e8f0" stroke-width="1"/>
    <text x="642" y="240" font-weight="700" fill="#334155">run</text>
    <text x="900" y="240" font-weight="700" fill="#334155">clients that differ</text>

    <text x="642" y="262" fill="#475569">width 32, PLANS</text>
    <text x="900" y="262" fill="#b91c1c">0 of 6</text>
    <text x="642" y="282" fill="#475569">width 1024, PLANS</text>
    <text x="900" y="282" fill="#b91c1c">0 of 6</text>
    <text x="642" y="302" fill="#166534" font-weight="700">width 1024, SPLIT_PLANS</text>
    <text x="900" y="302" fill="#166534" font-weight="700">3 of 6</text>
  </g>
  <line x1="642" y1="318" x2="1128" y2="318" stroke="#e2e8f0" stroke-width="1"/>
  <text x="642" y="338" font-size="10.5" fill="#64748b">With one live partial, keeping the winner is exact. The bug only exists when</text>
  <text x="642" y="353" font-size="10.5" fill="#64748b">two chunks both saw keys, so a test that never gets there can't fail.</text>
  <text x="642" y="368" font-size="10.5" font-weight="700" fill="#b91c1c">Two of three configurations would have shipped it green.</text>

  <!-- ===================== LEFT BOTTOM: armbench ===================== -->
  <text x="50" y="412" font-size="13.5" font-weight="700" fill="#334155">armbench.py: how long a request must be before the split is tested</text>
  <rect x="50" y="424" width="530" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="9.5" font-family="ui-monospace, monospace">
    <text x="66" y="448" font-weight="700" fill="#334155">config</text>
    <text x="190" y="448" font-weight="700" fill="#334155">width</text>
    <text x="246" y="448" font-weight="700" fill="#334155">splits</text>
    <text x="306" y="448" font-weight="700" fill="#334155">chunk</text>
    <text x="362" y="448" font-weight="700" fill="#334155">floor</text>
    <text x="418" y="448" font-weight="700" fill="#334155">PLANS</text>
    <text x="474" y="448" font-weight="700" fill="#334155">SPLIT_PLANS</text>

    <text x="66" y="472" fill="#475569">toy, Day 60</text>
    <text x="190" y="472" fill="#475569">32</text>
    <text x="246" y="472" fill="#b91c1c">1</text>
    <text x="306" y="472" fill="#475569">32</text>
    <text x="362" y="472" fill="#b91c1c">-</text>
    <text x="418" y="472" fill="#b91c1c">no</text>
    <text x="474" y="472" fill="#b91c1c">no</text>

    <text x="66" y="494" fill="#475569">toy, Day 68</text>
    <text x="190" y="494" fill="#475569">1024</text>
    <text x="246" y="494" fill="#475569">2</text>
    <text x="306" y="494" fill="#475569">512</text>
    <text x="362" y="494" fill="#475569">514</text>
    <text x="418" y="494" fill="#b91c1c">no</text>
    <text x="474" y="494" fill="#166534" font-weight="700">yes</text>

    <text x="66" y="516" fill="#475569">serving</text>
    <text x="190" y="516" fill="#475569">8192</text>
    <text x="246" y="516" fill="#475569">16</text>
    <text x="306" y="516" fill="#475569">512</text>
    <text x="362" y="516" fill="#475569">514</text>
    <text x="418" y="516" fill="#b91c1c">no</text>
    <text x="474" y="516" fill="#166534" font-weight="700">yes</text>
  </g>

  <line x1="72" y1="536" x2="558" y2="536" stroke="#e2e8f0" stroke-width="1"/>
  <text x="72" y="556" font-size="10.5" fill="#64748b">Floor: the shortest prompt plus completion whose last read reaches chunk 1.</text>
  <text x="72" y="571" font-size="10.5" fill="#64748b">512 keys, plus one to cross, plus the sampled token nobody reads. The chunk is</text>
  <text x="72" y="586" font-size="10.5" fill="#64748b">512 at serving size too: the partition sets it, not the width.</text>
  <text x="72" y="610" font-size="10.5" font-weight="700" fill="#b45309">A split is only tested by rows longer than a chunk.</text>

  <!-- ===================== RIGHT BOTTOM: the gate ===================== -->
  <text x="620" y="412" font-size="13.5" font-weight="700" fill="#334155">check_arm_split: the row length comes from the client</text>
  <rect x="620" y="424" width="530" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="9.5" font-family="ui-monospace, monospace">
    <rect x="640" y="440" width="170" height="54" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="650" y="460" font-weight="700" fill="#4338ca">client usage block</text>
    <text x="650" y="480" fill="#475569">prompt + completion - 1</text>

    <rect x="640" y="504" width="170" height="54" rx="5" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
    <text x="650" y="524" font-weight="700" fill="#4338ca">/health split_workspace</text>
    <text x="650" y="544" fill="#475569">splits, keys_per_split</text>

    <rect x="900" y="470" width="228" height="58" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="910" y="490" font-weight="700" fill="#166534">check_arm_split</text>
    <text x="910" y="506" fill="#166534">splits &gt;= 2</text>
    <text x="910" y="520" fill="#166534">longest_row &gt; keys_per_split</text>
  </g>
  <path d="M 811 467 L 897 490" stroke="#4338ca" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 811 531 L 897 510" stroke="#4338ca" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="642" y="580" font-size="10.5" fill="#64748b">The read's counters are shapes only: counting long rows is a .item() per layer per</text>
  <text x="642" y="595" font-size="10.5" fill="#64748b">step, and under a captured graph that Python never runs. The client sees every length.</text>
  <text x="642" y="619" font-size="10.5" font-weight="700" fill="#b91c1c">2217 green. Still no second measured.</text>
</svg>
