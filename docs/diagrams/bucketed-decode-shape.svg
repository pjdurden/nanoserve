  <text x="352" y="215" font-size="20" fill="#94a3b8">...</text>
  <text x="352" y="260" font-size="8.5" font-family="ui-monospace, monospace" fill="#7f1d1d">[3, 516]</text>

  <rect x="66" y="278" width="352" height="22" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="74" y="293" font-size="9" font-family="ui-monospace, monospace" fill="#7f1d1d">512 steps -&gt; 512 distinct shapes -&gt; 512 builds asked for</text>
  <text x="66" y="320" font-size="9.5" fill="#64748b">Past `cache_size_limit` (8) dynamo stops compiling the frame and runs eager for</text>
  <text x="66" y="333" font-size="9.5" fill="#64748b">the rest of the process. Nothing is raised and nothing is logged.</text>

  <text x="440" y="212" font-size="9.5" font-weight="700" fill="#b91c1c">rows moves when the</text>
  <text x="440" y="225" font-size="9.5" font-weight="700" fill="#b91c1c">scheduler admits, width</text>
  <text x="440" y="238" font-size="9.5" font-weight="700" fill="#b91c1c">moves every single step</text>

  <!-- ===================== RIGHT TOP: the bucketed step ===================== -->
  <text x="620" y="148" font-size="13.5" font-weight="700" fill="#334155">bucketed: both axes rounded up, and the padded row has two jobs</text>
  <rect x="620" y="160" width="530" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="636" y="182" font-size="10.5" font-weight="700" fill="#15803d">3 rows -&gt; row bucket 4, width 5 -&gt; multiple of 8</text>

  <g>
    <rect x="636" y="196" width="15" height="15" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="0.7"/>
