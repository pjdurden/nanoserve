<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4338ca"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
    <marker id="arrowgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="50" y="46" font-size="26" font-weight="700" fill="#1e1b4b">The boot path, two probes, and four ceilings that are one number</text>
  <text x="50" y="72" font-size="14.5" fill="#64748b">Six days of CUDA graph work sat behind flags build_engine never passed through, so a server started from serve.py ran the Day-47 eager</text>
  <text x="50" y="92" font-size="14.5" fill="#64748b">loop. Wiring it up is where the last constraint turned up: the capture list is row buckets x width buckets, so a cap on how many graphs the</text>
  <text x="50" y="112" font-size="14.5" fill="#64748b">process holds is a cap on a width, exactly like Day 55's byte budget, arrived at from somewhere else entirely.</text>

  <!-- ===================== LEFT: the boot order ===================== -->
  <text x="50" y="150" font-size="13.5" font-weight="700" fill="#334155">The order, and what is on the card when each probe is taken</text>
  <rect x="50" y="162" width="470" height="474" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="9.5" font-family="ui-monospace, monospace">
    <rect x="68" y="180" width="262" height="28" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="0.9"/>
    <text x="78" y="198" fill="#3730a3">read_config, resolve_device, resolve_dtype</text>
    <text x="344" y="198" font-family="Inter, system-ui" fill="#94a3b8">card: empty</text>

    <rect x="68" y="217" width="262" height="28" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="0.9"/>
    <text x="78" y="235" fill="#3730a3">load_weights, place_weights</text>
    <text x="344" y="235" font-family="Inter, system-ui" fill="#475569">card: weights</text>

    <rect x="68" y="254" width="262" height="28" rx="4" fill="#312e81" stroke="#312e81"/>
    <text x="78" y="272" fill="#e0e7ff">probe 1: kv_budget_bytes</text>
    <text x="344" y="268" font-family="Inter, system-ui" font-size="9" fill="#475569">free = card minus the</text>
    <text x="344" y="279" font-family="Inter, system-ui" font-size="9" fill="#475569">weights. Honest.</text>

    <rect x="68" y="291" width="262" height="28" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="0.9"/>
    <text x="78" y="309" fill="#3730a3">plan_kv_pool -&gt; KVPoolPlan</text>
    <text x="344" y="305" font-family="Inter, system-ui" font-size="9" fill="#b45309">the pool is decided</text>
    <text x="344" y="316" font-family="Inter, system-ui" font-size="9" fill="#b45309">and not yet spent</text>

    <rect x="68" y="328" width="262" height="28" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="0.9"/>
    <text x="78" y="346" fill="#3730a3">Engine.build(bucket, persist, capture)</text>
    <text x="344" y="346" font-family="Inter, system-ui" fill="#15803d">Day 56: threaded</text>

    <rect x="68" y="365" width="262" height="28" rx="4" fill="#7f1d1d" stroke="#7f1d1d"/>
    <text x="78" y="383" fill="#fee2e2">probe 2: warm_budget_bytes</text>
    <text x="344" y="379" font-family="Inter, system-ui" font-size="9" font-weight="700" fill="#b91c1c">the pool is lazy, so the</text>
    <text x="344" y="390" font-family="Inter, system-ui" font-size="9" font-weight="700" fill="#b91c1c">driver still calls it free</text>

    <rect x="68" y="402" width="262" height="28" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.9"/>
    <text x="78" y="420" fill="#b91c1c">reserved_bytes = plan.pool_bytes</text>
    <text x="344" y="420" font-family="Inter, system-ui" font-size="9" fill="#b91c1c">Day 55 wrote this seam</text>

    <rect x="68" y="439" width="262" height="28" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="0.9"/>
    <text x="78" y="457" fill="#3730a3">plan_capture -&gt; CapturePlan</text>
    <text x="344" y="457" font-family="Inter, system-ui" fill="#475569">decision two</text>

    <rect x="68" y="476" width="262" height="28" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="0.9"/>
    <text x="78" y="494" fill="#166534">warm_engine -&gt; WarmupReport</text>
    <text x="344" y="490" font-family="Inter, system-ui" font-size="9" fill="#15803d">the first synthetic write</text>
    <text x="344" y="501" font-family="Inter, system-ui" font-size="9" fill="#15803d">allocates the KV pool</text>

    <rect x="68" y="513" width="262" height="28" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="0.9"/>
    <text x="78" y="531" fill="#3730a3">AsyncEngine(engine)</text>
    <text x="344" y="527" font-family="Inter, system-ui" font-size="9" font-weight="700" fill="#334155">the loop exists only</text>
    <text x="344" y="538" font-family="Inter, system-ui" font-size="9" font-weight="700" fill="#334155">from here down</text>

    <rect x="68" y="550" width="262" height="28" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="0.9"/>
    <text x="78" y="568" fill="#3730a3">create_app(info=boot_info(...))</text>
    <text x="344" y="568" font-family="Inter, system-ui" fill="#475569">/health, both decisions</text>
  </g>

  <path d="M 199 208 L 199 217" stroke="#4338ca" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 199 245 L 199 254" stroke="#4338ca" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 199 282 L 199 291" stroke="#4338ca" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 199 319 L 199 328" stroke="#4338ca" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 199 356 L 199 365" stroke="#4338ca" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 199 393 L 199 402" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#arrowred)"/>
  <path d="M 199 430 L 199 439" stroke="#4338ca" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 199 467 L 199 476" stroke="#15803d" stroke-width="1.4" marker-end="url(#arrowgreen)"/>
  <path d="M 199 504 L 199 513" stroke="#4338ca" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 199 541 L 199 550" stroke="#4338ca" stroke-width="1.4" marker-end="url(#arrow)"/>

  <line x1="68" y1="590" x2="502" y2="590" stroke="#e2e8f0" stroke-width="1"/>
  <text x="68" y="606" font-size="10.5" font-weight="700" fill="#334155">A warm batch writes the same buffers a real step writes.</text>
  <text x="68" y="621" font-size="10" fill="#64748b">So warming must happen above the bridge. build_app has no serving to hand</text>
  <text x="68" y="633" font-size="10" fill="#64748b">check_warm_before_serving, and that is the proof rather than the assertion.</text>

  <!-- ===================== RIGHT TOP: four ceilings, one number ===================== -->
  <text x="560" y="150" font-size="13.5" font-weight="700" fill="#334155">Four constraints, one integer, and a label saying who set it</text>
  <rect x="560" y="162" width="590" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="9" font-family="ui-monospace, monospace">
    <rect x="580" y="182" width="228" height="26" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="0.9"/>
    <text x="589" y="199" fill="#3730a3">served: plan.max_model_len</text>
    <text x="762" y="199" fill="#475569">2048</text>

    <rect x="580" y="214" width="228" height="26" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="0.9"/>
    <text x="589" y="231" fill="#3730a3">flag: --warm-width</text>
    <text x="762" y="231" fill="#94a3b8">unset</text>

    <rect x="580" y="246" width="228" height="26" rx="4" fill="#eef2ff" stroke="#c7d2fe" stroke-width="0.9"/>
    <text x="589" y="263" fill="#3730a3">budget: width_ceiling()</text>
    <text x="762" y="263" fill="#475569">4096</text>

    <rect x="580" y="278" width="228" height="26" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="0.9"/>
    <text x="589" y="295" fill="#b91c1c">limit: width_from_limit()</text>
    <text x="762" y="295" font-weight="700" fill="#b91c1c">1536</text>
  </g>

  <path d="M 812 195 L 872 237" stroke="#4338ca" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M 812 227 L 872 240" stroke="#4338ca" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M 812 259 L 872 247" stroke="#4338ca" stroke-width="1.3" marker-end="url(#arrow)"/>
  <path d="M 812 291 L 872 252" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#arrowred)"/>

  <rect x="880" y="212" width="248" height="66" rx="6" fill="#312e81" stroke="#312e81"/>
  <text x="894" y="234" font-size="10" font-family="ui-monospace, monospace" fill="#e0e7ff">max_width = 1536</text>
  <text x="894" y="252" font-size="10" font-family="ui-monospace, monospace" fill="#a5b4fc">width_bound_by = "limit"</text>
  <text x="894" y="269" font-size="9" fill="#c7d2fe">strictly tightest, then snapped to a bucket</text>

  <text x="580" y="325" font-size="10.5" font-weight="700" fill="#334155">A shared arena is sized by its largest member, so a byte budget was never</text>
  <text x="580" y="340" font-size="10.5" font-weight="700" fill="#334155">about the length of the list. Nor is a graph limit: rows x widths is a product.</text>
  <text x="580" y="358" font-size="10" fill="#64748b">A ceiling that ties with the served context did not bite, and reporting it would send you to the wrong knob.</text>

  <!-- ===================== RIGHT BOTTOM: the deployment table ===================== -->
  <text x="560" y="412" font-size="13.5" font-weight="700" fill="#334155">What a deployment asks for, against a 64-graph limit</text>
  <rect x="560" y="424" width="590" height="212" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g font-size="9.5" font-family="ui-monospace, monospace">
    <text x="580" y="448" font-weight="700" fill="#334155">slots x ctx</text>
    <text x="690" y="448" font-weight="700" fill="#334155">wanted</text>
    <text x="772" y="448" font-weight="700" fill="#334155">ceiling</text>
    <text x="860" y="448" font-weight="700" fill="#334155">kept</text>
    <text x="928" y="448" font-weight="700" fill="#334155">startup</text>
    <text x="1030" y="448" font-weight="700" fill="#334155">lazy, late</text>

    <text x="580" y="468" fill="#475569">8 x 2048</text>
    <text x="690" y="468" fill="#15803d">64</text><text x="772" y="468" fill="#475569">2048</text>
    <text x="860" y="468" fill="#15803d">64</text><text x="928" y="468" fill="#475569">3.20s</text>
    <text x="1030" y="468" fill="#15803d">0.00s</text>

    <text x="580" y="486" fill="#475569">16 x 2048</text>
    <text x="690" y="486" fill="#b91c1c">80</text><text x="772" y="486" fill="#b91c1c">1536</text>
    <text x="860" y="486" fill="#475569">60</text><text x="928" y="486" fill="#475569">3.00s</text>
    <text x="1030" y="486" fill="#475569">0.20s</text>

    <text x="580" y="504" fill="#475569">32 x 4096</text>
    <text x="690" y="504" fill="#b91c1c">192</text><text x="772" y="504" fill="#b91c1c">1280</text>
    <text x="860" y="504" fill="#475569">60</text><text x="928" y="504" fill="#475569">3.00s</text>
    <text x="1030" y="504" fill="#475569">1.10s</text>

    <text x="580" y="522" fill="#475569">64 x 8192</text>
    <text x="690" y="522" fill="#b91c1c">448</text><text x="772" y="522" fill="#b91c1c">1152</text>
    <text x="860" y="522" fill="#475569">63</text><text x="928" y="522" fill="#475569">3.15s</text>
    <text x="1030" y="522" fill="#475569">2.75s</text>

    <text x="580" y="540" fill="#475569">256 x 8192</text>
    <text x="690" y="540" fill="#b91c1c">576</text><text x="772" y="540" fill="#b91c1c">896</text>
    <text x="860" y="540" fill="#475569">63</text><text x="928" y="540" fill="#475569">3.15s</text>
    <text x="1030" y="540" fill="#475569">2.85s</text>
  </g>

  <text x="580" y="562" font-size="10" fill="#64748b">serve.py's defaults are the first row: 4 row buckets x 16 widths = 64, and the limit is 64. Nothing to spare.</text>

  <line x1="580" y1="574" x2="1128" y2="574" stroke="#e2e8f0" stroke-width="1"/>
  <text x="580" y="592" font-size="11" font-weight="700" fill="#334155">Trimming the top of the width axis is the cheap direction</text>
  <text x="580" y="608" font-size="10" fill="#64748b">A run walks widths from the bottom, so a shape left out up there is recorded once, late, by a request</text>
  <text x="580" y="621" font-size="10" fill="#64748b">that has already streamed thousands of tokens. At 256 x 8192 that trade gives back 25.65s of startup</text>
  <text x="580" y="634" font-size="10" fill="#64748b">and pays 2.85s spread over a full-length generation.</text>
</svg>
