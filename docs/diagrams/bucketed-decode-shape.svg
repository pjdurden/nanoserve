  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="50" y="46" font-size="26" font-weight="700" fill="#1e1b4b">The decode shape stops moving, and the closed set too big to capture</text>
  <text x="50" y="72" font-size="14.5" fill="#64748b">The rectangle is `[rows, max_ctx]` and max_ctx grows by one every step, so a 512-step run presents 512 shapes and dynamo abandons</text>
  <text x="50" y="92" font-size="14.5" fill="#64748b">the frame after eight. Day 52 rounds the batch up to a row bucket and the width up to a multiple: 512 shapes become 5. The padded</text>
  <text x="50" y="112" font-size="14.5" fill="#64748b">row reads nothing (context_lens = 0) and writes to a sink slot one past the end of the pool the allocator can hand out.</text>

  <!-- ===================== LEFT TOP: the open shape set ===================== -->
  <text x="50" y="148" font-size="13.5" font-weight="700" fill="#334155">open: one new shape per step, forever</text>
  <rect x="50" y="160" width="540" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="66" y="182" font-size="10.5" font-weight="700" fill="#b91c1c">Day 51: the rectangle is exactly what the batch is</text>

